# CI: format check plus a combined per-OS job that runs clippy, tests, and the
# desktop package smoke build (frontend + unsigned `cargo tauri build --no-bundle`).
#
# The Rust toolchain (with rustfmt and clippy) is pinned in rust-toolchain.toml;
# rustup installs it automatically, and Swatinem/rust-cache caches against it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-fmt
          cache-on-failure: true
      - run: cargo fmt --all --check

  ci:
    name: clippy, test & package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # System deps for the Tauri desktop app (webkit2gtk etc.).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-ci
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/desktop/ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend deps
        working-directory: apps/desktop/ui
        run: bun install

      - name: Build frontend
        working-directory: apps/desktop/ui
        run: bun run build

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Smoke build desktop app (unsigned, no bundle)
        run: cargo tauri build --ci --no-bundle --config apps/desktop/tauri.conf.json
