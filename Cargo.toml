# tobro workspace
#
# Member crates are added as M0 progresses:
#   crates/tobro-ipc, crates/tobro-tor, crates/tobrod, crates/tobroctl,
#   apps/desktop
#
# Dependency versions are declared here so every crate uses the same
# versions and feature sets. Arti and its companion crates are pinned
# exactly: Arti is pre-1.0 and its APIs still move between releases.

[workspace]
resolver = "3"
members = [
    "crates/tobro-config",
    "crates/tobro-helper",
    "crates/tobro-ipc",
    "crates/tobro-osapi",
    "crates/tobro-store",
    "crates/tobro-tor",
    "crates/tobro-tun",
    "crates/tobrod",
    "crates/tobroctl",
    "apps/desktop",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
# --- Tor / Arti -----------------------------------------------------------
# `experimental-api` exposes proxy/DNS server APIs; `geoip` enables exit country (F-37/M2).
arti = { version = "=2.8.0", features = ["experimental-api", "http-connect", "dns-proxy"] }
arti-client = { version = "=0.48.0", features = ["geoip"] }
tor-config = "=0.48.0"
tor-rtcompat = { version = "=0.48.0", features = ["tokio", "native-tls"] }

# --- Async runtime --------------------------------------------------------
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
futures = "0.3"
async-trait = "0.1"

# --- Serialization / config ----------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
bytes = "1"

# --- Errors / logging -----------------------------------------------------
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# --- CLI / paths / time ---------------------------------------------------
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- Storage / secrets ----------------------------------------------------
# Embedded/local libSQL (Turso-compatible) for tobro-store.
libsql = "0.6"
keyring = "4"
zeroize = "1"
hickory-proto = "0.26"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# --- HTTP (Moat, bridge data, updates) -----------------------------------
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "socks",
] }

# --- UPnP (Kindness Mode port mapping, F-62) ------------------------------
# Blocking IGDv1/IGDv2 client; only used via spawn_blocking.
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }

# --- TUN mode (M7 T4) -----------------------------------------------------
# `tobro-osapi` is the only crate allowed `unsafe` (see its lib.rs docs).
tobro-osapi = { path = "crates/tobro-osapi" }
# Linux backend: `tun2` creates the TUN device (safe ioctl wrapper, the
# workspace forbids unsafe code); `rtnetlink` configures addressing, MTU,
# link state, and routes via netlink so the helper never shells out (§10.5).
# The `async` feature provides `create_as_async` (not a default feature).
tun2 = { version = "4", features = ["async"] }
rtnetlink = "0.24"
# macOS backend (T4b): route tables go through the small audited PF_ROUTE
# FFI in `tobro-osapi`; DNS uses the SystemConfiguration dynamic store.
system-configuration = "0.8"
# Windows backend (T4c): adapter management (index, DNS, MTU, delete) via
# wintun-bindings; route tables via the iphlpapi FFI in `tobro-osapi`.
wintun-bindings = "0.7"
libc = "0.2"

# --- Desktop shell --------------------------------------------------------
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

# --- Dev / test -----------------------------------------------------------
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Dependencies (especially Arti's crypto) are painfully slow in a pure
# debug build. Build them with light optimization while keeping our own
# crates debuggable.
[profile.dev.package."*"]
opt-level = 1
