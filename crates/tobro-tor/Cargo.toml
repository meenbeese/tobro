[package]
name = "tobro-tor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arti = { workspace = true, features = ["dns-proxy", "experimental-api"] }
arti-client = { workspace = true, features = ["geoip", "onion-service-service"] }
tor-chanmgr = "=0.48.0"
tor-config = { workspace = true }
tor-hsrproxy = "=0.48.0"
tor-hsservice = { version = "=0.48.0", features = ["restricted-discovery"] }
tor-rtcompat = { workspace = true }
tor-socksproto = { version = "=0.48.0", features = ["proxy-handshake"] }
hickory-proto = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true }
async-stream = "0.3"

percent-encoding = "2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
safelog = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
arti-client = { workspace = true, features = [
    "experimental-api",
    "keymgr",
    "onion-service-client",
] }
tor-hscrypto = "=0.48.0"
tor-keymgr = "=0.48.0"
tor-llcrypto = { version = "=0.48.0", features = ["experimental"] }
tempfile = { workspace = true }
wiremock = { workspace = true }

[features]
default = ["pt-client"]
# Enables the pluggable-transport API surface
# (`config::pt::TransportConfig`, `BridgesConfig::transports`).
pt-client = ["arti-client/pt-client"]

[lints]
workspace = true
