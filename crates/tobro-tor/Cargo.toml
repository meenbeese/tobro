[package]
name = "tobro-tor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arti = { workspace = true, features = ["dns-proxy", "experimental-api"] }
arti-client = { workspace = true, features = ["geoip"] }
tor-chanmgr = "=0.48.0"
tor-config = { workspace = true }
tor-rtcompat = { workspace = true }
tor-socksproto = { version = "=0.48.0", features = ["proxy-handshake"] }
hickory-proto = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true }

percent-encoding = "2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[features]
default = ["pt-client"]
# Enables the pluggable-transport API surface
# (`config::pt::TransportConfig`, `BridgesConfig::transports`).
pt-client = ["arti-client/pt-client"]

[lints]
workspace = true
